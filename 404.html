<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        var routes = { hiragana: 1, katakana: 1 };
        var base = parts[0] && !routes[parts[0]] ? "/" + parts[0] + "/" : "/";
        document.write('<base href="' + base + '">');
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#100e0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Hiragana and katakana flashcards. Pick columns, then drill on a blank page: type to grade live, retry misses, full deck until a clean pass." />
    <title>Kana</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div id="shell">
      <div id="app"></div>
      <div id="answer-dock-root" hidden></div>
    </div>
    <script type="module" src="./js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js", { scope: "./" });
      }
    </script>
  </body>
</html>
